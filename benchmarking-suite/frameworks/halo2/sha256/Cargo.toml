[package]
name = "sha256"
version = "0.1.0"
edition = "2021"

[dependencies]
rand_core = "0.6"
sha2 = "0.10"
bincode = "1.3"

halo2_proofs = { path = "../halo2/halo2_proofs" }
halo2_gadgets = { path = "../halo2/halo2_gadgets", features = ["unstable-sha256-gadget"] }

[profile.release]
opt-level = 3
lto = true

[[bin]]
name = "setup"
path = "src/setup.rs"

[[bin]]
name = "prove"
path = "src/prove.rs"

[[bin]]
name = "verify"
path = "src/verify.rs"

